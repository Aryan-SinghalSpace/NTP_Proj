name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build · typecheck · test (with Postgres + RLS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracewell
          POSTGRES_PASSWORD: tracewell
          POSTGRES_DB: tracewell
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracewell"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The API reads these from process.env (dotenv doesn't override them in CI).
      MIGRATION_DATABASE_URL: postgres://tracewell:tracewell@localhost:5432/tracewell
      DATABASE_URL: postgres://tracewell_app:tracewell_app@localhost:5432/tracewell

    defaults:
      run:
        working-directory: code

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared field-types package
        run: pnpm --filter @tracewell/field-types build

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create the RLS app role (non-superuser)
        env:
          PGPASSWORD: tracewell
        run: psql -h localhost -U tracewell -d tracewell -f infra/postgres/init/01-app-role.sql

      - name: Run migrations
        run: pnpm --filter @tracewell/api migrate

      - name: Test — field-types
        run: pnpm --filter @tracewell/field-types test

      - name: Test — api (unit + RLS/service integration)
        run: pnpm --filter @tracewell/api test

      - name: Typecheck — api
        run: pnpm --filter @tracewell/api typecheck

      - name: Typecheck — web
        run: pnpm --filter @tracewell/web exec tsc --noEmit
